<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校慶全校資料整合</title><link rel="stylesheet" href="style.css?v=5"><main><header><div><small>校慶辦公室 · 多台資料整合</small><h1>全校資料整合</h1><p>每個年級可有多台；選取各台「完整備份 JSON」。</p></div></header><section class="panel"><label class="file">選取多個完整備份<input id="files" type="file" accept=".json,application/json" multiple></label><p class="hint">所有處理都在本裝置進行，不上傳名冊或收款資料。不改動各台原始備份。請先收齊最新備份，避免把舊快照混入。</p><p id="status" role="status"></p><div id="sources"></div></section><section id="conflicts" class="panel" hidden><h2>確認差異與疑似重複款項</h2><p>不會自動覆蓋有差異的紀錄。同學生同金額可能是兩筆真實捐款，請核對來源後選擇。</p><div id="issues"></div></section><section class="panel"><p id="summary">尚未匯入備份。</p><button id="export" class="primary" disabled>整合並匯出全校 Excel</button><p id="result" role="status"></p></section></main><script src="core.js?v=5"></script><script src="merge.js?v=5"></script><script src="merge-ui.js?v=5"></script></html>
